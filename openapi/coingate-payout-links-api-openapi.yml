                        example: 34
                      title:
                        type: string
                        example: Tether USD
                      kind:
                        type: string
                        enum:
                        - crypto
                        - fiat
                        example: crypto
                      symbol:
                        type: string
                        example: USDT
                      enabled:
                        type: boolean
                        description: false while the currency is temporarily disabled.
                        example: true
