openapi: 3.2.0
info:
  title: v2 Billing API
  version: '2'
servers:
- url: https://api.coingate.com/api/v2
security:
- {}
tags:
- name: Billing
paths:
  /billing/contacts:
    post:
      summary: Create Billing Contact
      description: ''
      operationId: create-billing-contact
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - contact_type
              - email
              properties:
                contact_type:
                  type: string
                  description: Type of contact
                  default: '"person"'
                  enum:
                  - '"person"'
                  - '"business"'
                email:
                  type: string
                  description: Contact email address
                first_name:
                  type: string
                  description: First name of the contact (required if contact_type is "person")
                surname:
                  type: string
                  description: Surname of the contact (required if contact_type is "person")
                company_name:
                  type: string
                  description: Name of the company (required if contact_type is "business")
                external_contact_id:
                  type: string
                  description: External Contact ID that is used in your application (e.g. user or customer ID).
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 1,\n  \"contact_type\": \"person\",\n  \"email\": \"joe@doe.com\",\n  \"first_name\": \"Joe\",\n  \"surname\": \"Doe\",\n  \"company_name\": null,\n  \"external_contact_id\": \"AA1234\",\n  \"created_at\": \"2024-10-15T15:38:35.787Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                    default: 0
                  contact_type:
                    type: string
                    example: person
                  email:
                    type: string
                    example: joe@doe.com
                  first_name:
                    type: string
                    example: Joe
                  surname:
                    type: string
                    example: Doe
                  company_name: {}
                  external_contact_id:
                    type: string
                    example: AA1234
                  created_at:
                    type: string
                    example: '2024-10-15T15:38:35.787Z'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Billing contact is not valid\",\n  \"reason\": \"BillingContactIsNotValid\",\n  \"errors\": {\n    \"email\": [\n      \"is not an email\",\n      \"can't be blank\"\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Billing contact is not valid
                  reason:
                    type: string
                    example: BillingContactIsNotValid
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        items:
                          type: string
                          example: is not an email
      deprecated: false
      tags:
      - Billing
    get:
      summary: List Billing Contacts
      description: ''
      operationId: list-billing-contacts
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                per_page:
                  type: integer
                  description: Records per page
                  default: 100
                  format: int32
                page:
                  type: integer
                  description: Current page number
                  default: 1
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"current_page\": 1,\n  \"per_page\": 100,\n  \"total_records\": 2,\n  \"total_pages\": 1,\n  \"billing_contacts\": [\n    {\n      \"id\": 1,\n      \"contact_type\": \"business\",\n      \"email\": \"example@company.com\",\n      \"first_name\": null,\n      \"surname\": null,\n      \"company_name\": \"UAB Company Name\",\n      \"created_at\": \"2024-10-15T13:52:31.587Z\"\n    },\n    {\n      \"id\": 2,\n      \"contact_type\": \"person\",\n      \"email\": \"joe@doe.com\",\n      \"first_name\": \"Joe\",\n      \"surname\": \"Doe\",\n      \"company_name\": null,\n      \"created_at\": \"2024-10-15T15:38:35.787Z\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    example: 1
                    default: 0
                  per_page:
                    type: integer
                    example: 100
                    default: 0
                  total_records:
                    type: integer
                    example: 2
                    default: 0
                  total_pages:
                    type: integer
                    example: 1
                    default: 0
                  billing_contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                          default: 0
                        contact_type:
                          type: string
                          example: business
                        email:
                          type: string
                          example: example@company.com
                        first_name: {}
                        surname: {}
                        company_name:
                          type: string
                          example: UAB Company Name
                        created_at:
                          type: string
                          example: '2024-10-15T13:52:31.587Z'
      deprecated: false
      tags:
      - Billing
  /billing/contacts/{id}:
    get:
      summary: Get Billing Contact
      description: ''
      operationId: get-billing-contact
      parameters:
      - name: id
        in: path
        description: Billing Contact ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 1,\n  \"contact_type\": \"person\",\n  \"email\": \"joe@doe.com\",\n  \"first_name\": \"Joe\",\n  \"surname\": \"Doe\",\n  \"company_name\": null,\n  \"created_at\": \"2024-10-15T15:38:35.787Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                    default: 0
                  contact_type:
                    type: string
                    example: person
                  email:
                    type: string
                    example: joe@doe.com
                  first_name:
                    type: string
                    example: Joe
                  surname:
                    type: string
                    example: Doe
                  company_name: {}
                  created_at:
                    type: string
                    example: '2024-10-15T15:38:35.787Z'
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Billing contact not found\",\n  \"reason\": \"BillingContactNotFound\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Billing contact not found
                  reason:
                    type: string
                    example: BillingContactNotFound
      deprecated: false
      tags:
      - Billing
    delete:
      summary: Delete Billing Contact
      description: ''
      operationId: delete-billing-contact
      parameters:
      - name: id
        in: path
        description: Billing Contact ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 1,\n  \"contact_type\": \"person\",\n  \"email\": \"joe@doe.com\",\n  \"first_name\": \"Joe\",\n  \"surname\": \"Doe\",\n  \"company_name\": null,\n  \"created_at\": \"2024-10-15T15:38:35.787Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                    default: 0
                  contact_type:
                    type: string
                    example: person
                  email:
                    type: string
                    example: joe@doe.com
                  first_name:
                    type: string
                    example: Joe
                  surname:
                    type: string
                    example: Doe
                  company_name: {}
                  created_at:
                    type: string
                    example: '2024-10-15T15:38:35.787Z'
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Billing contact not found\",\n  \"reason\": \"BillingContactNotFound\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Billing contact not found
                  reason:
                    type: string
                    example: BillingContactNotFound
      deprecated: false
      tags:
      - Billing
  /billing/products:
    post:
      summary: Create Billing Product
      description: ''
      operationId: create-billing-product
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - name
              - price
              - currency_id
              properties:
                name:
                  type: string
                  description: Product name
                price:
                  type: string
                  description: Product price
                currency_id:
                  type: integer
                  description: Currency ID's can be seen on https://developer.coingate.com/reference/currencies
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 1,\n  \"name\": \"Laptop\",\n  \"price\": \"1000.0\",\n  \"created_at\": \"2024-10-15T16:07:28.595Z\",\n  \"currency\": {\n    \"id\": 21,\n    \"title\": \"USDT\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"USDT\"\n  }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                    default: 0
                  name:
                    type: string
                    example: Laptop
                  price:
                    type: string
                    example: '1000.0'
                  created_at:
                    type: string
                    example: '2024-10-15T16:07:28.595Z'
                  currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 21
                        default: 0
                      title:
                        type: string
                        example: USDT
                      kind:
                        type: string
                        example: crypto
                      symbol:
                        type: string
                        example: USDT
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Billing product is not valid\",\n  \"reason\": \"BillingProductIsNotValid\",\n  \"errors\": {\n    \"price\": [\n      \"must be greater than 0\"\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Billing product is not valid
                  reason:
                    type: string
                    example: BillingProductIsNotValid
                  errors:
                    type: object
                    properties:
                      price:
                        type: array
                        items:
                          type: string
                          example: must be greater than 0
      deprecated: false
      tags:
      - Billing
    get:
      summary: List Billing Products
      description: ''
      operationId: list-billing-products
      parameters:
      - name: id
        in: path
        description: Billing Product ID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                per_page:
                  type: integer
                  description: Records per page
                  default: 100
                  format: int32
                page:
                  type: integer
                  description: Current page number
                  default: 1
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"current_page\": 1,\n  \"per_page\": 100,\n  \"total_records\": 2,\n  \"total_pages\": 1,\n  \"billing_products\": [\n    {\n      \"id\": 1,\n      \"name\": \"Laptop\n      \"price\": \"100\",\n      \"created_at\": \"2024-10-15T13:52:54.665Z\",\n      \"currency\": {\n        \"id\": 21,\n        \"title\": \"USDT\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"USDT\"\n      }\n    },\n    {\n      \"id\": 2,\n      \"name\": \"Mouse\",\n      \"price\": \"25\",\n      \"created_at\": \"2024-10-15T16:07:28.595Z\",\n      \"currency\": {\n        \"id\": 21,\n        \"title\": \"USDT\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"USDT\"\n      }\n    }\n  ]\n}"
      tags:
      - Billing
  /billing/products/{id}:
    get:
      summary: Get Billing Product
      description: ''
      operationId: get-billing-product
      parameters:
      - name: id
        in: path
        description: Billing Product ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 1,\n  \"name\": \"Laptop\",\n  \"price\": \"1000.0\",\n  \"created_at\": \"2024-10-15T16:07:28.595Z\",\n  \"currency\": {\n    \"id\": 21,\n    \"title\": \"USDT\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"USDT\"\n  }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                    default: 0
                  name:
                    type: string
                    example: Laptop
                  price:
                    type: string
                    example: '1000.0'
                  created_at:
                    type: string
                    example: '2024-10-15T16:07:28.595Z'
                  currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 21
                        default: 0
                      title:
                        type: string
                        example: USDT
                      kind:
                        type: string
                        example: crypto
                      symbol:
                        type: string
                        example: USDT
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Billing product not found\",\n  \"reason\": \"BillingProductNotFound\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Billing product not found
                  reason:
                    type: string
                    example: BillingProductNotFound
      tags:
      - Billing
    delete:
      summary: Delete Billing Product
      description: ''
      operationId: delete-billing-product
      parameters:
      - name: id
        in: path
        description: Billign Product ID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 1,\n  \"name\": \"Laptop\",\n  \"price\": \"1000.0\",\n  \"created_at\": \"2024-10-15T16:07:28.595Z\",\n  \"currency\": {\n    \"id\": 21,\n    \"title\": \"USDT\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"USDT\"\n  }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                    default: 0
                  name:
                    type: string
                    example: Laptop
                  price:
                    type: string
                    example: '1000.0'
                  created_at:
                    type: string
                    example: '2024-10-15T16:07:28.595Z'
                  currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 21
                        default: 0
                      title:
                        type: string
                        example: USDT
                      kind:
                        type: string
                        example: crypto
                      symbol:
                        type: string
                        example: USDT
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Billing product not found\",\n  \"reason\": \"BillingProductNotFound\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Billing product not found
                  reason:
                    type: string
                    example: BillingProductNotFound
      deprecated: false
      tags:
      - Billing
  /billing/requests:
    post:
      summary: Create Billing Request
      description: ''
      operationId: create-billing-request
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 1,\n  \"uuid\": \"f1d6b2ef-3024-4ea2-b046-60f96adc0fb5\",\n  \"status\": \"pending\",\n  \"title\": \"Lunch\",\n  \"due_days\": 3,\n  \"callback_url\": \"\",\n  \"send_email\": false,\n  \"underpaid_cover_pct\": \"0.0\",\n  \"created_at\": \"2024-10-15T16:59:05.757Z\",\n  \"billing_contact\": {\n    \"id\": 1,\n    \"contact_type\": \"person\",\n    \"email\": \"joe@doe.com\",\n    \"first_name\": \"Joe\",\n    \"surname\": \"Doe\",\n    \"external_contact_id\": \"AA1234\",\n    \"created_at\": \"2024-10-15T14:13:47.730Z\"\n  },\n  \"price_currency\": {\n    \"id\": 2,\n    \"title\": \"Euro\",\n    \"kind\": \"fiat\",\n    \"symbol\": \"EUR\"\n  },\n  \"price_amount\": \"20.0\",\n  \"receive_currency\": {\n    \"id\": 2,\n    \"title\": \"Euro\",\n    \"kind\": \"fiat\",\n    \"symbol\": \"EUR\"\n  },\n  \"receive_amount\": null,\n  \"pay_currency\": null,\n  \"pay_amount\":  null,\n  \"fees\": [],\n  \"billing_request_items\": [],\n  \"billing_request_url\": \"\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                    default: 0
                  uuid:
                    type: string
                    example: f1d6b2ef-3024-4ea2-b046-60f96adc0fb5
                  status:
                    type: string
                    example: pending
                  title:
                    type: string
                    example: Lunch
                  due_days:
                    type: integer
                    example: 3
                    default: 0
                  callback_url:
                    type: string
                    example: ''
                  send_email:
                    type: boolean
                    example: false
                    default: true
                  underpaid_cover_pct:
                    type: string
                    example: '0.0'
                  created_at:
                    type: string
                    example: '2024-10-15T16:59:05.757Z'
                  billing_contact:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                        default: 0
                      contact_type:
                        type: string
                        example: person
                      email:
                        type: string
                        example: joe@doe.com
                      first_name:
                        type: string
                        example: Joe
                      surname:
                        type: string
                        example: Doe
                      external_contact_id:
                        type: string
                        example: AA1234
                      created_at:
                        type: string
                        example: '2024-10-15T14:13:47.730Z'
                  price_currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                        default: 0
                      title:
                        type: string
                        example: Euro
                      kind:
                        type: string
                        example: fiat
                      symbol:
                        type: string
                        example: EUR
                  price_amount:
                    type: string
                    example: '20.0'
                  receive_currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                        default: 0
                      title:
                        type: string
                        example: Euro
                      kind:
                        type: string
                        example: fiat
                      symbol:
                        type: string
                        example: EUR
                  receive_amount: {}
                  pay_currency: {}
                  pay_amount: {}
                  fees:
                    type: array
                  billing_request_items:
                    type: array
                  billing_request_url:
                    type: string
                    example: ''
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Billing request is not valid\",\n  \"reason\": \"BillingRequestIsNotValid\",\n  \"errors\": [\n    \"Amount must be greater than 0\"\n  ]\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Billing request is not valid
                  reason:
                    type: string
                    example: BillingRequestIsNotValid
                  errors:
                    type: array
                    items:
                      type: string
                      example: Amount must be greater than 0
      deprecated: false
      requestBody:
        content:
          application/json:
            schema:
              properties:
                billing_contact_id:
                  type: integer
                  format: int32
                  description: Billing Contact ID
                title:
                  type: string
                  description: Request title
                currency_id:
                  type: integer
                  format: int32
                  description: Currency of amount. Currency ID's can be seen on https://developer.coingate.com/reference/currencies
                amount:
                  type: string
                  description: Amount is required only when the request is created without associated products. If products are included, the amount is automatically calculated based on the product prices and quantities
                receive_currency_id:
                  type: integer
                  format: int32
                  description: Currency ID's can be seen on https://developer.coingate.com/reference/currencies
                due_days:
                  type: integer
                  description: 'Defines how many days the pay button remains active. Default: 0 won''t expire. Example: A value of 3 means the pay button will remain active for 3 days after billing request has been created'
                  format: int32
                  default: '0'
                send_email:
                  type: boolean
                  default: 'true'
                  description: Will billing contact receive email about reqeust.
                underpaid_cover_pct:
                  type: string
                  description: How much percentage of underpaid can be covered.
                  default: '0'
                callback_url:
                  type: string
                  description: Send an automated message to Merchant URL when request status is changed. For testing you can use requestcatcher.com tool. URL must be direct without redirection. Read about billing request callbacks [here](https://developer.coingate.com/reference/billing-request-callback).
                billing_request_items:
                  type: object
                  properties:
                    billing_product_id:
                      type: integer
                      description: Billing Product ID
                      format: int32
                    quantity:
                      type: integer
                      format: int32
                      description: Quantity of product
                  description: Billing Products and quantity. If present amount will calculated based on product price and quantity.
              type: object
              required:
              - billing_contact_id
              - currency_id
              - receive_currency_id
      tags:
      - Billing
    get:
      summary: List Billing Requests
      description: ''
      operationId: list-billing-requests
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                per_page:
                  type: integer
                  description: Records per page
                  default: 100
                  format: int32
                page:
                  type: integer
                  description: Current page number
                  default: 1
                  format: int32
                sort:
                  type: string
                  description: 'Sort billing requests by field. Available sort options: created_at_asc, created_at_desc. Default: created_at_asc.'
                  default: created_at_asc
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
