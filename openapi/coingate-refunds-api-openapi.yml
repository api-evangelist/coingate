paths:
  /refunds:
    get:
      summary: Get Refunds
      description: ''
      operationId: get-refunds
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: Current page number
                  default: 1
                  format: int32
                per_page:
                  type: integer
                  description: Number of refunds per page (max - 100)
                  default: 100
                  format: int32
                created_at:
                  properties:
                    from:
                      type: string
                      description: 'Optional. Where refund creation time is equal or greater. Example: 2018-09-01'
                    to:
                      type: string
                      description: 'Optional. Where refund creation time is equal or less. Example: 2018-09-30'
                  required: []
                  type: object
                updated_at:
                  properties:
                    from:
                      type: string
                      description: 'Optional. Where refund updated time is equal or greater. Example: 2018-09-01'
                    at:
                      type: string
                      description: 'Optional. Where refund updated time is equal or less. Example: 2018-09-30'
                  required: []
                  type: object
                sort:
                  type: string
                  description: 'Sort orders by field. Available sort options: created_at_asc, created_at_desc, updated_at_asc, updated_at_desc. Default: created_at_desc.'
                  default: created_at_desc
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    current_page: 1
                    per_page: 100
                    total_refunds: 2
                    total_pages: 1
