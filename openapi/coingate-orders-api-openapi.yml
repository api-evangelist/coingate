openapi: 3.2.0
info:
  title: v2 Orders API
  version: '2'
servers:
- url: https://api.coingate.com/api/v2
security:
- {}
tags:
- name: Orders
paths:
  /orders:
    post:
      summary: Create Order
      description: Create order at CoinGate and redirect shopper to invoice (payment_url).
      operationId: create-order
      responses:
        '200':
          description: '200'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n  \"id\": 538,\n  \"status\": \"new\",\n  \"title\": \"Order #111\",\n  \"do_not_convert\": false,\n  \"orderable_type\": \"ApiApp\",\n  \"orderable_id\": 3,\n  \"price_currency\": \"EUR\",\n  \"price_amount\": \"10.0\",\n  \"lightning_network\": false,\n  \"receive_currency\": \"EUR\",\n  \"receive_amount\": \"0\",\n  \"created_at\": \"2022-12-09T14:02:41+00:00\",\n  \"order_id\": \"111\",\n  \"payment_url\": \"http://localhost:3000/invoice/a275c4a1-fc54-45b1-a98a-66652e338fb2\",\n  \"underpaid_amount\": \"0\",\n  \"overpaid_amount\": \"0\",\n  \"is_refundable\": false,\n  \"refunds\": [],\n  \"voids\": [],\n  \"fees\": [],\n  \"token\": \"PsPXSa46uohMtMWqfzTrnwy3p3sNmQ\",\n\t\"blockchain_transactions\": []\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 538
                    default: 0
                  status:
                    type: string
                    example: new
                  title:
                    type: string
                    example: 'Order #111'
                  do_not_convert:
                    type: boolean
                    example: false
                    default: true
                  orderable_type:
                    type: string
                    example: ApiApp
                  orderable_id:
                    type: integer
                    example: 3
                    default: 0
                  price_currency:
                    type: string
                    example: EUR
                  price_amount:
                    type: string
                    example: '10.0'
                  lightning_network:
                    type: boolean
                    example: false
                    default: true
                  receive_currency:
                    type: string
                    example: EUR
                  receive_amount:
                    type: string
                    example: '0'
                  created_at:
                    type: string
                    example: '2022-12-09T14:02:41+00:00'
                  order_id:
                    type: string
                    example: '111'
                  payment_url:
                    type: string
                    example: http://localhost:3000/invoice/a275c4a1-fc54-45b1-a98a-66652e338fb2
                  underpaid_amount:
                    type: string
                    example: '0'
                  overpaid_amount:
                    type: string
                    example: '0'
                  is_refundable:
                    type: boolean
                    example: false
                    default: true
                  refunds:
                    type: array
                  voids:
                    type: array
                  fees:
                    type: array
                  token:
                    type: string
                    example: PsPXSa46uohMtMWqfzTrnwy3p3sNmQ
                  blockchain_transactions:
                    type: array
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"message\": \"Order is not valid\",\n    \"reason\": \"OrderIsNotValid\",\n    \"errors\": [\n        \"Price can't be blank\",\n        \"Price is not a number\",\n        \"Btc amount can't be blank\",\n        \"Btc amount is not a number\"\n    ]\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order is not valid
                  reason:
                    type: string
                    example: OrderIsNotValid
                  errors:
                    type: array
                    items:
                      type: string
                      example: Price can't be blank
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: "## Create Order\ncurl -X \"POST\" \"http://localhost:3000/api/v2/orders\" \\\n     -H 'Authorization: Token YOU_API_TOKEN' \\\n     -H 'Content-Type: application/x-www-form-urlencoded; charset=utf-8' \\\n     --data-urlencode \"title=My Store Order #111\" \\\n     --data-urlencode \"price_amount=1369\" \\\n     --data-urlencode \"price_currency=EUR\" \\\n     --data-urlencode \"receive_currency=USDC\" \\\n     --data-urlencode \"callback_url=https://example.com/test\" \\\n     --data-urlencode \"success_url=http://example.com/success\" \\\n     --data-urlencode \"cancel_url=http://example.com/cancel\" \\\n     --data-urlencode \"order_id=111\" \\\n     --data-urlencode \"description=iPhone 16 Pro Max (256 GB)\" \\\n     --data-urlencode \"shopper[type]=personal\" \\\n     --data-urlencode \"shopper[ip_address]=127.0.0.1\" \\\n     --data-urlencode \"shopper[email]=test@example.com\" \\\n     --data-urlencode \"shopper[first_name]=Joe\" \\\n     --data-urlencode \"shopper[last_name]=Doe\" \\\n     --data-urlencode \"shopper[date_of_birth]=1987-02-12\"\n"
        - language: php
          code: "<?php\n// API endpoint URL\n$url = 'https://api-sandbox.coingate.com/api/v2/orders';\n\n// Request headers\n$headers = [\n    'Authorization: Token YOUR_API_TOKEN',\n    'Content-Type: application/x-www-form-urlencoded; charset=utf-8',\n];\n\n// Request payload\n$data = http_build_query([\n    'title' => 'My Store Order #111',\n    'price_amount' => '1369',\n    'price_currency' => 'EUR',\n    'receive_currency' => 'USDC',\n    'callback_url' => 'https://example.com/test',\n    'success_url' => 'http://example.com/success',\n    'cancel_url' => 'http://example.com/cancel',\n    'order_id' => '111',\n    'description' => 'iPhone 16 Pro Max (256 GB)',\n    'shopper[type]' => 'personal',\n    'shopper[ip_address]' => '127.0.0.1',\n    'shopper[email]' => 'test@example.com',\n    'shopper[first_name]' => 'Joe',\n    'shopper[last_name]' => 'Doe',\n    'shopper[date_of_birth]' => '1987-02-12'\n]);\n\n// Initialize cURL session\n$ch = curl_init($url);\n\n// cURL options\ncurl_setopt($ch, CURLOPT_POST, true);\ncurl_setopt($ch, CURLOPT_HTTPHEADER, $headers);\ncurl_setopt($ch, CURLOPT_POSTFIELDS, $data);\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n\n// Execute cURL request\n$response = curl_exec($ch);\n\n// Check for errors\nif (curl_errno($ch)) {\n    echo 'cURL Error: ' . curl_error($ch);\n    exit;\n}\n\n// Close cURL session\ncurl_close($ch);\n\n// Decode JSON response\n$responseData = json_decode($response, true);\n\n// Check if payment_url is present in response\nif (isset($responseData['payment_url'])) {\n    $paymentUrl = $responseData['payment_url'];\n    // Redirect to payment URL\n    header(\"Location: $paymentUrl\");\n    exit;\n} else {\n    echo 'Payment URL not found in the response.';\n    print_r($responseData); // For debugging purposes\n}"
        samples-languages:
        - curl
        - php
      requestBody:
        content:
          application/json:
            schema:
              properties:
                order_id:
                  type: string
                  description: 'Merchant''s custom order ID. We recommend using a unique order ID. Example: CGORDER-12345.'
                price_amount:
                  type: number
                  format: double
                  description: 'The price set by the merchant. Example: 1050.99.'
                price_currency:
                  type: string
                  description: '[ISO 4217](http://en.wikipedia.org/wiki/ISO_4217) currency code which defines the currency in which you wish to price your merchandise used to define price parameter. [Supported currencies](https://developer.coingate.com/docs/currencies)'
                receive_currency:
                  type: string
                  description: '[ISO 4217](http://en.wikipedia.org/wiki/ISO_4217) currency code specifying the currency in which you want to receive settlements. Currency conversions are handled by CoinGate. See [Supported Settlement Currencies](https://developer.coingate.com/reference/currencies) for available options, or use DO_NOT_CONVERT to keep the payment in its original currency. For setup instructions, see [How to Configure Settlement Currency](https://support.coingate.com/hc/en-us/articles/21208494395676).'
                title:
                  type: string
                  description: 'Min 3 - Max 150 characters. Example: product title (Apple iPhone 6), order id (MyShop Order #12345), cart id (Cart #00004335).'
                description:
                  type: string
                  description: 'More details about this order. Min 3 - Max 500 characters. It can be cart items, product details or other information. Example: 1 x Apple iPhone 6, 1 x Apple MacBook Air.'
                callback_url:
                  type: string
                  description: Send an automated message to Merchant URL when order status is changed. For testing you can use [requestcatcher.com](https://requestcatcher.com/) tool. URL must be direct without redirection.
                cancel_url:
                  type: string
                  description: Redirect to Merchant URL when buyer cancels the order
                success_url:
                  type: string
                  description: Redirect to Merchant URL after successful payment
                token:
                  type: string
                  description: Your custom token to validate payment callback (notification).
                shopper:
                  type: object
                  properties:
                    type:
                      type: string
                      description: Shopper type. Must be 'personal' or 'business' ('company' is also accepted as an alias for 'business').
                    email:
                      type: string
                      description: Shopper's e-mail address
                    ip_address:
                      type: string
                      description: Shopper's IP address
                    personal:
                      type: object
                      properties:
                        first_name:
                          type: string
                          description: Shopper's first name.
                        last_name:
                          type: string
                          description: Shopper's last name.
                        date_of_birth:
                          type: string
                          format: date
                          description: Shopper's date of birth. Must be a valid date in the format YYYY-MM-DD.
                        residence_country:
                          type: string
                          description: Shopper's country of residence. Must be a valid Alpha-2 country code.
                      description: Personal details of the shopper. Provide when the shopper type is 'personal'.
                    company:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Company's legal name.
                        code:
                          type: string
                          description: Company code (or business ID number) assigned by the authority under which the company is registered.
                        registration_country:
                          type: string
                          description: Country where the company is registered. Must be a valid Alpha-2 country code.
                      description: Company details of the shopper. Provide when the shopper type is 'business'.
                  description: Optional object to enhance the shopper’s experience and prefill the Travel Rule form on the checkout page. Learn more about the [Travel Rule](https://coingate.com/blog/post/travel-rule-explained). All fields are optional.
              type: object
              required:
              - price_amount
              - price_currency
              - title
              - description
      tags:
      - Orders
    get:
      summary: List Orders
      description: Retrieving information of all placed orders.
      operationId: list-orders
      parameters:
      - name: per_page
        in: query
        description: 'How many orders per page. Max: 100. Default: 100.'
        schema:
          type: integer
          format: int32
          default: 100
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: sort
        in: query
        description: 'Sort orders by field. Available sort options: created_at_asc, created_at_desc. Default: created_at_desc.'
        schema:
          type: string
          default: created_at_desc
      - name: created_at[from]
        in: query
        description: 'Optional. Where order creation time is equal or greater. Example: 2018-09-01'
        schema:
          type: string
      - name: created_at[to]
        in: query
        description: 'Optional. Where order creation time is equal or less. Example: 2018-09-30'
        schema:
          type: string
      - name: status
        in: query
        description: Filter by order status. [Order statuses](https://developer.coingate.com/reference/order-statuses)
        schema:
          type: string
      - name: paid_at[from]
        in: query
        description: 'Optional. Where order paid at time is equal or greater. Example: 2018-09-01'
        schema:
          type: string
      - name: paid_at[to]
        in: query
        description: 'Optional. Where order creation time is equal or less. Example: 2018-09-30'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    current_page: 1
                    per_page: 2
                    total_orders: 455
                    total_pages: 228
