openapi: 3.2.0
info:
  title: v2 Invoice API
  version: '2'
servers:
- url: https://api.coingate.com/api/v2
security:
- {}
tags:
- name: Invoice
paths:
  /invoice/{uuid}/request-void:
    post:
      summary: Create Void Request
      description: ''
      operationId: void-request
      parameters:
      - name: uuid
        in: path
        description: Invoice UUID
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - address
              - crypto_platform_id
              properties:
                address:
                  type: string
                  description: Crypto wallet address
                additional_field:
                  type: string
                  description: Crypto addres memo or destination tag
                crypto_platform_id:
                  type: integer
                  description: '[Crypto Platform](https://developer.coingate.com/reference/platforms)'
                  format: int32
                email:
                  type: string
                  description: Shopper's email
                comment:
                  type: string
                accept_payment:
                  type: boolean
                  description: If payment was paid in full, you can mark the ‘Accept Payment’ checkbox on the refund form and we will make every attempt to process this payment, however, it may not be possible and a refund may be required.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 9,\n  \"status\": \"pending\",\n  \"address\": \"36c3KtqTpnhCRXp5179HR6hpKxP2XDahKF\",\n  \"comment\": null,\n  \"additional_field\": null,\n  \"accept_payment\": false,\n  \"currency\": {\n    \"id\": 1,\n    \"title\": \"Bitcoin\",\n    \"symbol\": \"BTC\",\n    \"platform\": {\n      \"id\": 5,\n      \"title\": \"Bitcoin\"\n    }\n  }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 9
                    default: 0
                  status:
                    type: string
                    example: pending
                  address:
                    type: string
                    example: 36c3KtqTpnhCRXp5179HR6hpKxP2XDahKF
                  comment: {}
                  additional_field: {}
                  accept_payment:
                    type: boolean
                    example: false
                    default: true
                  currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                        default: 0
                      title:
                        type: string
                        example: Bitcoin
                      symbol:
                        type: string
                        example: BTC
                      platform:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 5
                            default: 0
                          title:
                            type: string
                            example: Bitcoin
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": {\n    \"fields\": {\n      \"crypto_platform_id\": [\n        \"not found or does not belong to this currency\"\n      ],\n      \"base\": [\n        \"Refund is not eligible for this order\"\n      ]\n    },\n    \"full_messages\": [\n      \"Crypto platform not found or does not belong to this currency\",\n      \"Refund is not eligible for this order\"\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      fields:
                        type: object
                        properties:
                          crypto_platform_id:
                            type: array
                            items:
                              type: string
                              example: not found or does not belong to this currency
                          base:
                            type: array
                            items:
                              type: string
                              example: Refund is not eligible for this order
                      full_messages:
                        type: array
                        items:
                          type: string
                          example: Crypto platform not found or does not belong to this currency
      deprecated: false
      security: []
      tags:
      - Invoice
    get:
      summary: Get Void Request
      description: Retrieves a void request for a specific order. This endpoint is public, authentication is not required.
      operationId: get-void-request
      parameters:
      - name: uuid
        in: path
        description: Invoice UUID
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 9,\n  \"status\": \"pending\",\n  \"address\": \"36c3KtqTpnhCRXp5179HR6hpKxP2XDahKF\",\n  \"comment\": null,\n  \"additional_field\": null,\n  \"accept_payment\": false,\n  \"created_at\": \"2022-12-06T10:58:21+00:00\",\n  \"currency\": {\n    \"id\": 1,\n    \"title\": \"Bitcoin\",\n    \"symbol\": \"BTC\",\n    \"platform\": {\n      \"id\": 5,\n      \"title\": \"Bitcoin\"\n    }\n  }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 9
                    default: 0
                  status:
                    type: string
                    example: pending
                  address:
                    type: string
                    example: 36c3KtqTpnhCRXp5179HR6hpKxP2XDahKF
                  comment: {}
                  additional_field: {}
                  accept_payment:
                    type: boolean
                    example: false
                    default: true
                  created_at:
                    type: string
                    example: '2022-12-06T10:58:21+00:00'
                  currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                        default: 0
                      title:
                        type: string
                        example: Bitcoin
                      symbol:
                        type: string
                        example: BTC
                      platform:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 5
                            default: 0
                          title:
                            type: string
                            example: Bitcoin
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"message\": \"Void Request not found\",\n\t\"reason\": \"VoidRequestNotFound\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Void Request not found
                  reason:
                    type: string
                    example: VoidRequestNotFound
      deprecated: false
      security: []
      tags:
      - Invoice
  /invoice/{uuid}:
    get:
      summary: Invoice
      description: ''
      operationId: invoice
      parameters:
      - name: uuid
        in: path
        description: Order UUID
        schema:
          type: string
        required: true
      - name: cg_org
        in: query
        description: 'cg_org[format_address]=inline. Possible values: inline, newline, array'
        schema:
          properties: {}
          type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"uuid\": \"c0ac16b0-528e-4615-9cc0-d6b09706dc05\",\n  \"cg_org\": {\n    \"title\": \"UAB Decentralized\",\n    \"id_name\": \"coingate_uab\",\n    \"address\": \"Registration code: 303423510\\nVAT code: LT100014216412\\nGoštauto g. 8, LT-01108\\nVilnius, Lithuania\"\n  }\n}"
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: c0ac16b0-528e-4615-9cc0-d6b09706dc05
                  cg_org:
                    type: object
                    properties:
                      title:
                        type: string
                        example: UAB Decentralized
                      id_name:
                        type: string
                        example: coingate_uab
                      address:
                        type: string
                        example: 'Registration code: 303423510

                          VAT code: LT100014216412

                          Goštauto g. 8, LT-01108

                          Vilnius, Lithuania'
        '404':
          description: '404'
          content:
            application/json:
              examples:
                Result:
                  value: '{"message":"Record not found","reason":"RecordNotFound"}'
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Record not found
                  reason:
                    type: string
                    example: RecordNotFound
      deprecated: false
      security: []
      tags:
      - Invoice
x-readme:
  headers: []
  explorer-enabled: false
  proxy-enabled: true
x-readme-fauxas: true
