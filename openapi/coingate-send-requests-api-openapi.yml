openapi: 3.2.0
info:
  title: v2 Send Requests API
  version: '2'
servers:
- url: https://api.coingate.com/api/v2
security:
- {}
tags:
- name: Send Requests
paths:
  /send_requests:
    post:
      summary: Create Send Request
      description: ''
      operationId: create-send
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - ledger_account_id
              - beneficiary_payout_setting_id
              - amount
              - amount_currency_id
              - purpose
              properties:
                ledger_account_id:
                  type: string
                  description: Ledger account ID can be retrieved from https://api.coingate.com/api/v2/ledger/accounts
                beneficiary_payout_setting_id:
                  type: integer
                  description: Beneficiary payout setting ID can be retrieved from https://api.coingate.com/api/v2/beneficiaries
                  format: int32
                amount:
                  type: string
                  description: Amount to send
                amount_currency_id:
                  type: integer
                  description: Currency of amount. Currency ID's can be seen on https://developer.coingate.com/reference/currencies
                  format: int32
                purpose:
                  type: string
                  description: Purpose of sending
                callback_url:
                  type: string
                  description: Send an automated message to Merchant URL when request status is changed. For testing you can use requestcatcher.com tool. URL must be direct without redirection. Read about billing request callbacks here.
                external_id:
                  type: string
                  description: 'This field allows merchants to associate the record with their own internal reference. If provided, it must be unique.. (max length: 50)'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 11,\n  \"status\": \"draft\",\n  \"purpose\": \"Sending 100 EUR Value\",\n  \"callback_url\": \"https://example.com/callback_url\",\n  \"created_at\": \"2025-03-13T00:45:17.250Z\",\n  \"external_id\": \"1\",\n  \"requestable_id\": 7,\n  \"requestable_type\": \"batch_payout\",\n  \"ledger_account\": {\n    \"id\": \"01JNQWKKJ6WXN8BZT1Y66B6G9H\",\n    \"balance\": \"1.0\",\n    \"status\": \"active\",\n    \"currency\": {\n      \"id\": 1,\n      \"title\": \"Bitcoin\",\n      \"symbol\": \"BTC\"\n    }\n  },\n  \"input_amount\": \"100.0\",\n  \"input_currency\": {\n    \"id\": 2,\n    \"title\": \"Euro\",\n    \"kind\": \"fiat\",\n    \"symbol\": \"EUR\"\n  },\n  \"sending_amount\": \"0.049422\",\n  \"sending_currency\": {\n    \"id\": 5,\n    \"title\": \"Ethereum\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"ETH\"\n  },\n  \"input_to_sending_rate\": \"0.00049422\",\n  \"sending_to_balance_debit_rate\": \"40.3258\",\n  \"balance_debit_amount\": \"0.00122557\",\n  \"balance_debit_currency\": {\n    \"id\": 1,\n    \"title\": \"Bitcoin\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"BTC\"\n  },\n  \"beneficiary_payout_setting\": {\n    \"id\": 2,\n    \"created_at\": \"2025-03-07T10:39:33.152Z\",\n    \"beneficiary_id\": 1,\n    \"platform\": {\n      \"id\": 2,\n      \"title\": \"Ethereum\",\n      \"id_name\": \"ethereum\"\n    },\n    \"crypto_address\": \"tb1qcq670zweall6zz4f96flfrefhr8myfxz9ll9l2\",\n    \"crypto_address_metadata\": null,\n    \"currency\": {\n      \"id\": 5,\n      \"title\": \"Ethereum\",\n      \"kind\": \"crypto\",\n      \"symbol\": \"ETH\"\n    }\n  },\n  \"fees\": {\n    \"service_fee\": {\n      \"amount\": \"0.00001226\",\n      \"currency\": {\n        \"id\": 1,\n        \"title\": \"Bitcoin\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"BTC\"\n      }\n    },\n    \"conversion_fee\": {\n      \"amount\": \"0.00001226\",\n      \"currency\": {\n        \"id\": 1,\n        \"title\": \"Bitcoin\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"BTC\"\n      }\n    }\n  },\n  \"blockchain_transactions\": [],\n  \"actions_required\": {\n    \"confirm\": \"https://api.coingate.com/api/v2/send_requests/11/confirm\",\n    \"cancel\": \"https://api.coingate.com/api/v2/send_requests/11/cancel\"\n  },\n  \"requires_2fa_confirmation\": true\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 11
                    default: 0
                  status:
                    type: string
                    example: draft
                  purpose:
                    type: string
                    example: Sending 100 EUR Value
                  callback_url:
                    type: string
                    example: https://example.com/callback_url
                  created_at:
                    type: string
                    example: '2025-03-13T00:45:17.250Z'
                  external_id:
                    type: string
                    example: '1'
                  requestable_id:
                    type: integer
                    description: null when the send request was not created from a batch payout or payout link.
                    example: 7
                  requestable_type:
                    type: string
                    description: null when the send request was not created from a batch payout or payout link.
                    enum:
                    - batch_payout
                    - payout_link
                    example: batch_payout
                  ledger_account:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01JNQWKKJ6WXN8BZT1Y66B6G9H
                      balance:
                        type: string
                        example: '1.0'
                      status:
                        type: string
                        example: active
                      currency:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                            default: 0
                          title:
                            type: string
                            example: Bitcoin
                          symbol:
                            type: string
                            example: BTC
                  input_amount:
                    type: string
                    example: '100.0'
                  input_currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                        default: 0
                      title:
                        type: string
                        example: Euro
                      kind:
                        type: string
                        example: fiat
                      symbol:
                        type: string
                        example: EUR
                  sending_amount:
                    type: string
                    example: '0.049422'
                  sending_currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                        default: 0
                      title:
                        type: string
                        example: Ethereum
                      kind:
                        type: string
                        example: crypto
                      symbol:
                        type: string
                        example: ETH
                  input_to_sending_rate:
                    type: string
                    example: '0.00049422'
                  sending_to_balance_debit_rate:
                    type: string
                    example: '40.3258'
                  balance_debit_amount:
                    type: string
                    example: '0.00122557'
                  balance_debit_currency:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                        default: 0
                      title:
                        type: string
                        example: Bitcoin
                      kind:
                        type: string
                        example: crypto
                      symbol:
                        type: string
                        example: BTC
                  beneficiary_payout_setting:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                        default: 0
                      created_at:
                        type: string
                        example: '2025-03-07T10:39:33.152Z'
                      beneficiary_id:
                        type: integer
                        example: 1
                        default: 0
                      platform:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                            default: 0
                          title:
                            type: string
                            example: Ethereum
                          id_name:
                            type: string
                            example: ethereum
                      crypto_address:
                        type: string
                        example: tb1qcq670zweall6zz4f96flfrefhr8myfxz9ll9l2
                      crypto_address_metadata: {}
                      currency:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 5
                            default: 0
                          title:
                            type: string
                            example: Ethereum
                          kind:
                            type: string
                            example: crypto
                          symbol:
                            type: string
                            example: ETH
                  fees:
                    type: object
                    properties:
                      service_fee:
                        type: object
                        properties:
                          amount:
                            type: string
                            example: '0.00001226'
                          currency:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                                default: 0
                              title:
                                type: string
                                example: Bitcoin
                              kind:
                                type: string
                                example: crypto
                              symbol:
                                type: string
                                example: BTC
                      conversion_fee:
                        type: object
                        properties:
                          amount:
                            type: string
                            example: '0.00001226'
                          currency:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                                default: 0
                              title:
                                type: string
                                example: Bitcoin
                              kind:
                                type: string
                                example: crypto
                              symbol:
                                type: string
                                example: BTC
                  blockchain_transactions:
                    type: array
                  actions_required:
                    type: object
                    properties:
                      confirm:
                        type: string
                        example: https://api.coingate.com/api/v2/send_requests/11/confirm
                      cancel:
                        type: string
                        example: https://api.coingate.com/api/v2/send_requests/11/cancel
                  requires_2fa_confirmation:
                    type: boolean
                    example: true
                    default: true
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"SendRequest is not valid\",\n  \"reason\": \"SendRequestIsNotValid\",\n  \"errors\": [\n    \"Ledger account is invalid\"\n  ]\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: SendRequest is not valid
                  reason:
                    type: string
                    example: SendRequestIsNotValid
                  errors:
                    type: array
                    items:
                      type: string
                      example: Ledger account is invalid
      deprecated: false
      tags:
      - Send Requests
    get:
      summary: List Send Requests
      description: ''
      operationId: list-send
      parameters:
      - name: page
        in: query
        description: Current page number
        schema:
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Records per page (max - 100)
        schema:
          type: integer
          format: int32
          default: 100
      - name: requestable_type
        in: query
        description: Return only send requests created by this source. Combine with requestable_id to filter down to a single batch payout or payout link.
        schema:
          type: string
          enum:
          - batch_payout
          - payout_link
      - name: requestable_id
        in: query
        description: ID of the source that created the send requests, e.g. the batch payout ID. Combine with requestable_type, otherwise the same ID may match both a batch payout and a payout link.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"current_page\": 1,\n  \"per_page\": 100,\n  \"total_records\": 1,\n  \"total_pages\": 1,\n  \"send_requests\": [\n    {\n  \"id\": 11,\n  \"status\": \"draft\",\n  \"purpose\": \"Sending 100 EUR Value\",\n  \"callback_url\": \"https://example.com/callback_url\",\n  \"created_at\": \"2025-03-13T00:45:17.250Z\",\n  \"external_id\": \"1\",\n  \"requestable_id\": 7,\n  \"requestable_type\": \"batch_payout\",\n  \"ledger_account\": {\n    \"id\": \"01JNQWKKJ6WXN8BZT1Y66B6G9H\",\n    \"balance\": \"1.0\",\n    \"status\": \"active\",\n    \"currency\": {\n      \"id\": 1,\n      \"title\": \"Bitcoin\",\n      \"symbol\": \"BTC\"\n    }\n  },\n  \"input_amount\": \"100.0\",\n  \"input_currency\": {\n    \"id\": 2,\n    \"title\": \"Euro\",\n    \"kind\": \"fiat\",\n    \"symbol\": \"EUR\"\n  },\n  \"sending_amount\": \"0.049422\",\n  \"sending_currency\": {\n    \"id\": 5,\n    \"title\": \"Ethereum\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"ETH\"\n  },\n  \"input_to_sending_rate\": \"0.00049422\",\n  \"sending_to_balance_debit_rate\": \"40.3258\",\n  \"balance_debit_amount\": \"0.00122557\",\n  \"balance_debit_currency\": {\n    \"id\": 1,\n    \"title\": \"Bitcoin\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"BTC\"\n  },\n  \"beneficiary_payout_setting\": {\n    \"id\": 2,\n    \"created_at\": \"2025-03-07T10:39:33.152Z\",\n    \"beneficiary_id\": 1,\n    \"platform\": {\n      \"id\": 2,\n      \"title\": \"Ethereum\",\n      \"id_name\": \"ethereum\"\n    },\n    \"crypto_address\": \"tb1qcq670zweall6zz4f96flfrefhr8myfxz9ll9l2\",\n    \"crypto_address_metadata\": null,\n    \"currency\": {\n      \"id\": 5,\n      \"title\": \"Ethereum\",\n      \"kind\": \"crypto\",\n      \"symbol\": \"ETH\"\n    }\n  },\n  \"fees\": {\n    \"service_fee\": {\n      \"amount\": \"0.00001226\",\n      \"currency\": {\n        \"id\": 1,\n        \"title\": \"Bitcoin\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"BTC\"\n      }\n    },\n    \"conversion_fee\": {\n      \"amount\": \"0.00001226\",\n      \"currency\": {\n        \"id\": 1,\n        \"title\": \"Bitcoin\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"BTC\"\n      }\n    }\n  },\n  \"blockchain_transactions\": [],\n  \"actions_required\": {\n    \"confirm\": \"https://api.coingate.com/api/v2/send_requests/11/confirm\",\n    \"cancel\": \"https://api.coingate.com/api/v2/send_requests/11/cancel\"\n  },\n  \"requires_2fa_confirmation\": true\n}\n  ]\n}"
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    example: 1
                    default: 0
                  per_page:
                    type: integer
                    example: 100
                    default: 0
                  total_records:
                    type: integer
                    example: 1
                    default: 0
                  total_pages:
                    type: integer
                    example: 1
                    default: 0
                  send_requests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 11
                          default: 0
                        status:
                          type: string
                          example: draft
                        purpose:
                          type: string
                          example: Sending 100 EUR Value
                        callback_url:
                          type: string
                          example: https://example.com/callback_url
                        created_at:
                          type: string
                          example: '2025-03-13T00:45:17.250Z'
                        external_id:
                          type: string
                          example: '1'
                        requestable_id:
                          type: integer
                          description: null when the send request was not created from a batch payout or payout link.
                          example: 7
                        requestable_type:
                          type: string
                          description: null when the send request was not created from a batch payout or payout link.
                          enum:
                          - batch_payout
                          - payout_link
                          example: batch_payout
                        ledger_account:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 01JNQWKKJ6WXN8BZT1Y66B6G9H
                            balance:
                              type: string
                              example: '1.0'
                            status:
                              type: string
                              example: active
                            currency:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 1
                                  default: 0
                                title:
                                  type: string
                                  example: Bitcoin
                                symbol:
                                  type: string
                                  example: BTC
                        input_amount:
                          type: string
                          example: '100.0'
                        input_currency:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 2
                              default: 0
                            title:
                              type: string
                              example: Euro
                            kind:
                              type: string
                              example: fiat
                            symbol:
                              type: string
                              example: EUR
                        sending_amount:
                          type: string
                          example: '0.049422'
                        sending_currency:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 5
                              default: 0
                            title:
                              type: string
                              example: Ethereum
                            kind:
                              type: string
                              example: crypto
                            symbol:
                              type: string
                              example: ETH
                        input_to_sending_rate:
                          type: string
                          example: '0.00049422'
                        sending_to_balance_debit_rate:
                          type: string
                          example: '40.3258'
                        balance_debit_amount:
                          type: string
                          example: '0.00122557'
                        balance_debit_currency:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                              default: 0
                            title:
                              type: string
                              example: Bitcoin
                            kind:
                              type: string
                              example: crypto
                            symbol:
                              type: string
                              example: BTC
                        beneficiary_payout_setting:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 2
                              default: 0
                            created_at:
                              type: string
                              example: '2025-03-07T10:39:33.152Z'
                            beneficiary_id:
                              type: integer
                              example: 1
                              default: 0
                            platform:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 2
                                  default: 0
                                title:
                                  type: string
                                  example: Ethereum
                                id_name:
                                  type: string
                                  example: ethereum
                            crypto_address:
                              type: string
                              example: tb1qcq670zweall6zz4f96flfrefhr8myfxz9ll9l2
                            crypto_address_metadata: {}
                            currency:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 5
                                  default: 0
                                title:
                                  type: string
                                  example: Ethereum
                                kind:
                                  type: string
                                  example: crypto
                                symbol:
                                  type: string
                                  example: ETH
                        fees:
                          type: object
                          properties:
                            service_fee:
                              type: object
                              properties:
                                amount:
                                  type: string
                                  example: '0.00001226'
                                currency:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      example: 1
                                      default: 0
                                    title:
                                      type: string
                                      example: Bitcoin
                                    kind:
                                      type: string
                                      example: crypto
                                    symbol:
                                      type: string
                                      example: BTC
                            conversion_fee:
                              type: object
                              properties:
                                amount:
                                  type: string
                                  example: '0.00001226'
                                currency:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      example: 1
                                      default: 0
                                    title:
                                      type: string
                                      example: Bitcoin
                                    kind:
                                      type: string
                                      example: crypto
                                    symbol:
                                      type: string
                                      example: BTC
                        blockchain_transactions:
                          type: array
                        actions_required:
                          type: object
                          properties:
                            confirm:
                              type: string
                              example: https://api.coingate.com/api/v2/send_requests/11/confirm
                            cancel:
                              type: string
                              example: https://api.coingate.com/api/v2/send_requests/11/cancel
                        requires_2fa_confirmation:
                          type: boolean
                          example: true
                          default: true
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Invalid parameters\",\n  \"reason\": \"InvalidParameters\",\n  \"errors\": [\n    \"requestable_type must be one of: batch_payout, payout_link\"\n  ]\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid parameters
                  reason:
                    type: string
                    example: InvalidParameters
                  errors:
                    type: array
                    items:
                      type: string
                      example: 'requestable_type must be one of: batch_payout, payout_link'
      deprecated: false
      tags:
      - Send Requests
  /send_requests/:id:
    get:
      summary: Get Send Request
      description: ''
      operationId: get-send
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 11,\n  \"status\": \"draft\",\n  \"purpose\": \"Sending 100 EUR Value\",\n  \"callback_url\": \"https://example.com/callback_url\",\n  \"created_at\": \"2025-03-13T00:45:17.250Z\",\n  \"external_id\": null,\n  \"requestable_id\": 7,\n  \"requestable_type\": \"batch_payout\",\n  \"ledger_account\": {\n    \"id\": \"01JNQWKKJ6WXN8BZT1Y66B6G9H\",\n    \"balance\": \"1.0\",\n    \"status\": \"active\",\n    \"currency\": {\n      \"id\": 1,\n      \"title\": \"Bitcoin\",\n      \"symbol\": \"BTC\"\n    }\n  },\n  \"input_amount\": \"100.0\",\n  \"input_currency\": {\n    \"id\": 2,\n    \"title\": \"Euro\",\n    \"kind\": \"fiat\",\n    \"symbol\": \"EUR\"\n  },\n  \"sending_amount\": \"0.049422\",\n  \"sending_currency\": {\n    \"id\": 5,\n    \"title\": \"Ethereum\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"ETH\"\n  },\n  \"input_to_sending_rate\": \"0.00049422\",\n  \"sending_to_balance_debit_rate\": \"40.3258\",\n  \"balance_debit_amount\": \"0.00122557\",\n  \"balance_debit_currency\": {\n    \"id\": 1,\n    \"title\": \"Bitcoin\",\n    \"kind\": \"crypto\",\n    \"symbol\": \"BTC\"\n  },\n  \"beneficiary_payout_setting\": {\n    \"id\": 2,\n    \"created_at\": \"2025-03-07T10:39:33.152Z\",\n    \"beneficiary_id\": 1,\n    \"platform\": {\n      \"id\": 2,\n      \"title\": \"Ethereum\",\n      \"id_name\": \"ethereum\"\n    },\n    \"crypto_address\": \"tb1qcq670zweall6zz4f96flfrefhr8myfxz9ll9l2\",\n    \"crypto_address_metadata\": null,\n    \"currency\": {\n      \"id\": 5,\n      \"title\": \"Ethereum\",\n      \"kind\": \"crypto\",\n      \"symbol\": \"ETH\"\n    }\n  },\n  \"fees\": {\n    \"service_fee\": {\n      \"amount\": \"0.00001226\",\n      \"currency\": {\n        \"id\": 1,\n        \"title\": \"Bitcoin\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"BTC\"\n      }\n    },\n    \"conversion_fee\": {\n      \"amount\": \"0.00001226\",\n      \"currency\": {\n        \"id\": 1,\n        \"title\": \"Bitcoin\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"BTC\"\n      }\n    }\n  },\n  \"blockchain_transactions\": [],\n  \"actions_required\": {\n    \"confirm\": \"https://api.coingate.com/api/v2/send_requests/11/confirm\",\n    \"cancel\": \"https://api.coingate.com/api/v2/send_requests/11/cancel\"\n  },\n  \"requires_2fa_confirmation\": true\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 11
                    default: 0
                  status:
                    type: string
                    example: draft
                  purpose:
                    type: string
                    example: Sending 100 EUR Value
                  callback_url:
                    type: string
                    example: https://example.com/callback_url
                  created_at:
                    type: string
                    example: '2025-03-13T00:45:17.250Z'
                  external_id: {}
                  requestable_id:
                    type: integer
                    description: null when the send request was not created from a batch payout or payout link.
                    example: 7
                  requestable_type:
                    type: string
                    description: null when the send request was not created from a batch payout or payout link.
                    enum:
                    - batch_payout
                    - payout_link
                    example: batch_payout
                  ledger_account:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01JNQWKKJ6WXN8BZT1Y66B6G9H
                      balance:
                        type: string
                        example: '1.0'
                      status:
                        type: string
                        example: active
                      currency:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                            default: 0
                          title:
                            type: string
                            example: Bitcoin
                          symbol:
                            type: string
                            example: BTC
                  input_amount:
                    type: string
                    example: '100.0'
                  input_currency:
                    type: object
                    properties:
                      id:
                        type: integer
