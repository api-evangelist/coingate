openapi: 3.2.0
info:
  title: v2 Ledger API
  version: '2'
servers:
- url: https://api.coingate.com/api/v2
security:
- {}
tags:
- name: Ledger
paths:
  /ledger/accounts:
    get:
      summary: List Accounts
      description: List the ledger accounts that belong to the authenticated account. Ledger accounts hold your funds on CoinGate, with one account per currency and account type. Only visible accounts are returned — those with status `active` or `suspended` — and each includes its current balance and currency details. Results are paginated, 100 per page by default.
      operationId: ledger-accounts
      parameters:
      - name: page
        in: query
        description: Page number. Defaults to 1.
        schema:
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Records per page. Defaults to 100, maximum 100. Values below 1 are set to 1.
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: A paginated list of ledger accounts.
          content:
            application/json:
              examples:
                Result:
                  value:
                    current_page: 1
                    per_page: 100
                    total_accounts: 2
                    total_pages: 1
                    accounts:
                    - id: 01KS2DT6X277ZEERSGKRPW8YZV
                      balance: '10.88'
                      status: active
                      account_type: main
                      title: Euro main account
                      currency:
                        id: 2
                        title: Euro
                        kind: fiat
                        symbol: EUR
                        enabled: true
                        disabled_message: null
                    - id: 01KJZ0PM6K2V3ZFV416S17Q6MH
                      balance: '1443.060408'
                      status: active
                      account_type: main
                      title: USDC main account
                      currency:
                        id: 22
                        title: USDC
                        kind: crypto
                        symbol: USDC
                        enabled: true
                        disabled_message: null
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    description: Current page number.
                    example: 1
                  per_page:
                    type: integer
                    description: Records per page.
                    example: 100
                  total_accounts:
                    type: integer
                    description: Total number of visible accounts.
                    example: 2
                  total_pages:
                    type: integer
                    description: Total number of pages.
                    example: 1
                  accounts:
                    type: array
                    description: The ledger accounts on this page.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The ledger account ID (ULID).
                          example: 01KS2DT6X277ZEERSGKRPW8YZV
                        balance:
                          type: string
                          description: Current balance, floored to the currency's precision. Returned as a string to preserve precision.
                          example: '10.88'
                        status:
                          type: string
                          enum:
                          - active
                          - disabled
                          - error_creating
                          - suspended
                          description: Account state. Only active/suspended accounts are listed.
                          example: active
                        account_type:
                          type: string
                          enum:
                          - main
                          - secondary
                          - tertiary
                          description: Type of the ledger account.
                          example: main
                        title:
                          type:
                          - string
                          - 'null'
                          description: Account title. Defaults to "{currency title} {account_type} account" when not set explicitly.
                          example: Euro main account
                        currency:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Currency ID.
                              example: 2
                            title:
                              type: string
                              description: Currency name.
                              example: Euro
                            kind:
                              type: string
                              enum:
                              - fiat
                              - crypto
                              description: Whether the currency is fiat or crypto.
                              example: fiat
                            symbol:
                              type: string
                              description: ISO symbol of the currency.
                              example: EUR
                            enabled:
                              type: boolean
                              description: Whether the currency is currently enabled (not temporarily disabled).
                              example: true
                            disabled_message:
                              type:
                              - string
                              - 'null'
                              description: Reason the currency is temporarily disabled, or null when enabled.
                              example: null
        '401':
          description: Missing or invalid API token.
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: Auth Token is not valid
                    reason: BadAuthToken
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Auth Token is not valid
                  reason:
                    type: string
                    example: BadAuthToken
      deprecated: false
      tags:
      - Ledger
  /ledger/transactions:
    get:
      summary: List Transactions
      description: This endpoint allows you to retrieve a list of all ledger transactions associated with your CoinGate account. This is crucial for reconciliation purposes, enabling you to track all movements of funds (credits and debits) and maintain an accurate ledger of your financial activities within the CoinGate system.
      operationId: list-transactions
      parameters:
      - name: page
        in: query
        description: Current page number
        schema:
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Number of refunds per page (max - 100)
        schema:
          type: integer
          format: int32
          default: 100
      - name: sort
        in: query
        description: One of "created_at_desc", "created_at_asc"
        schema:
          type: string
          default: created_at_desc
      - name: date_from
        in: query
        schema:
          type: string
      - name: date_to
        in: query
        schema:
          type: string
      - name: currency
        in: query
        description: ISO 4217 currency code, e.g. BTC, EUR, USD
        schema:
          type: string
      - name: type
        in: query
        description: Filter by transaction type (e.g. fee, merchant_order, withdrawal). See the type field for the full list of values.
        schema:
          type: string
          enum:
          - trader_order_buy
          - trader_order_sell
          - trader_order_swap
          - withdrawal
          - fee
          - withdrawal_revert
          - fee_revert
          - merchant_refund
          - merchant_refund_revert
          - merchant_order
          - merchant_order_revert
          - funds_transfer
          - deposit
          - exchange_addition
          - exchange_deduction
          - balance_deduction
          - mass_payout
          - mass_payout_entry_refund
          - merchant_order_pfb_deduction
          - mass_payout_entry_service_fee_refund
          - send_request
          - send_request_revert
          - flat_fee
          - outgoing_fee
          - conversion_fee
          - fx_revenue
          - exchange_fee
          - claim_transaction_fee
          - order_unclaimed_funds_addition
          - order_unclaimed_funds_deduction
          - abandonment_fee
          - abandonment_balance
          - deposit_revert
          - usdt_usdc_conversion
          - fx_revenue_revert
          - tx_network_fee
          - batch_payout
          - batch_payout_revert
          - payout_link
          - payout_link_revert
      - in: query
        name: source_type
        schema:
          type: string
        description: Type of the associated record (e.g. Order, Withdrawal). Must be provided together with `source_id`
      - in: query
        name: source_id
        schema:
          type: string
        description: Identifier of the associated record. Must be provided together with `source_type`
      responses:
        '200':
          description: A paginated list of ledger transactions.
          content:
            application/json:
              examples:
                Result:
                  value:
                    current_page: 1
                    per_page: 100
                    sort: created_at_desc
                    date_from: ''
                    date_to: ''
                    currency: all
                    total_entries: 22
                    total_pages: 1
                    entries:
                    - id: 01KS2DT7051V73P3A64P71GMBE
                      created_at: '2026-05-20T10:10:01.862Z'
                      purpose: 'Order ID #67983 processing fee 0.11 EUR'
                      type: fee
                      source_type: Fee
                      source_id: '139981'
                      account:
                        id: 01KS2DT6X277ZEERSGKRPW8YZV
                        balance: '10.88'
                        status: active
                        account_type: main
                        title: Euro main account
                        currency:
                          id: 2
                          title: Euro
                          kind: fiat
                          symbol: EUR
                          enabled: true
                          disabled_message: null
                      currency:
                        id: 2
                        title: Euro
                        kind: fiat
                        symbol: EUR
                        enabled: true
                        disabled_message: null
                      credited_amount: '0.11'
                      debited_amount: '0'
                      closing_balance: '10.88'
                    - id: 01KS2DT6XRJ210SZHYT36HWYS9
                      created_at: '2026-05-20T10:10:01.784Z'
                      purpose: 'Order ID #67983 10.99 EUR'
                      type: merchant_order
                      source_type: Order
                      source_id: '67983'
                      account:
                        id: 01KS2DT6X277ZEERSGKRPW8YZV
                        balance: '10.88'
                        status: active
                        account_type: main
                        title: Euro main account
                        currency:
                          id: 2
                          title: Euro
                          kind: fiat
                          symbol: EUR
                          enabled: true
                          disabled_message: null
                      currency:
                        id: 2
                        title: Euro
                        kind: fiat
                        symbol: EUR
                        enabled: true
                        disabled_message: null
                      credited_amount: '0'
                      debited_amount: '10.99'
                      closing_balance: '10.99'
              schema:
                type: object
                properties:
                  current_page:
                    type: integer
                    description: Current page number.
                    example: 1
                  per_page:
                    type: integer
                    description: Records per page.
                    example: 100
                  sort:
                    type: string
                    description: The sort order applied.
                    example: created_at_desc
                  date_from:
                    type: string
                    description: The date_from filter applied (empty string if none).
                    example: ''
                  date_to:
                    type: string
                    description: The date_to filter applied (empty string if none).
                    example: ''
                  currency:
                    type: string
                    description: The currency filter applied (all if none).
                    example: all
                  total_entries:
                    type: integer
                    description: Total number of matching transactions.
                    example: 22
                  total_pages:
                    type: integer
                    description: Total number of pages.
                    example: 1
                  entries:
                    type: array
                    description: The transactions on this page.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The transaction (ledger entry) ID (ULID). Sortable by creation time.
                          example: 01KS2DT7051V73P3A64P71GMBE
                        created_at:
                          type: string
                          format: date-time
                          description: When the transaction was created (ISO 8601, UTC).
                          example: '2026-05-20T10:10:01.862Z'
                        purpose:
                          type:
                          - string
                          - 'null'
                          description: Free-text note describing the transaction, or null.
                          example: 'Order ID #67983 processing fee 0.11 EUR'
                        type:
                          type: string
                          enum:
                          - trader_order_buy
                          - trader_order_sell
                          - trader_order_swap
                          - withdrawal
                          - fee
                          - withdrawal_revert
                          - fee_revert
                          - merchant_refund
                          - merchant_refund_revert
                          - merchant_order
                          - merchant_order_revert
                          - funds_transfer
                          - deposit
                          - exchange_addition
                          - exchange_deduction
                          - balance_deduction
                          - mass_payout
                          - mass_payout_entry_refund
                          - merchant_order_pfb_deduction
                          - mass_payout_entry_service_fee_refund
                          - send_request
                          - send_request_revert
                          - flat_fee
                          - outgoing_fee
                          - conversion_fee
                          - fx_revenue
                          - exchange_fee
                          - claim_transaction_fee
                          - order_unclaimed_funds_addition
                          - order_unclaimed_funds_deduction
                          - abandonment_fee
                          - abandonment_balance
                          - deposit_revert
                          - usdt_usdc_conversion
                          - fx_revenue_revert
                          - tx_network_fee
                          - batch_payout
                          - batch_payout_revert
                          - payout_link
                          - payout_link_revert
                          description: The kind of ledger transaction.
                          example: fee
                        source_type:
                          type:
                          - string
                          - 'null'
                          description: Type of the record that produced this transaction (e.g. Order, Fee, Withdrawal), or null.
                          example: Fee
                        source_id:
                          type:
                          - string
                          - 'null'
                          description: ID of the record that produced this transaction, or null.
                          example: '139981'
                        account:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ledger account ID (ULID).
                              example: 01KS2DT6X277ZEERSGKRPW8YZV
                            balance:
                              type: string
                              description: Current balance, floored to the currency's precision. Returned as a string to preserve precision.
                              example: '10.88'
                            status:
                              type: string
                              enum:
                              - active
                              - disabled
                              - error_creating
                              - suspended
                              description: Account state.
                              example: active
                            account_type:
                              type: string
                              enum:
                              - main
                              - secondary
                              - tertiary
                              description: Type of the ledger account.
                              example: main
                            title:
                              type:
                              - string
                              - 'null'
                              description: Account title. Defaults to "{currency title} {account_type} account" when not set explicitly.
                              example: Euro main account
                            currency:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: Currency ID.
                                  example: 2
                                title:
                                  type: string
                                  description: Currency name.
                                  example: Euro
                                kind:
                                  type: string
                                  enum:
                                  - fiat
                                  - crypto
                                  description: Whether the currency is fiat or crypto.
                                  example: fiat
                                symbol:
                                  type: string
                                  description: ISO symbol of the currency.
                                  example: EUR
                                enabled:
                                  type: boolean
                                  description: Whether the currency is currently enabled (not temporarily disabled).
                                  example: true
                                disabled_message:
                                  type:
                                  - string
                                  - 'null'
                                  description: Reason the currency is temporarily disabled, or null when enabled.
                                  example: null
                        currency:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Currency ID.
                              example: 2
                            title:
                              type: string
                              description: Currency name.
                              example: Euro
                            kind:
                              type: string
                              enum:
                              - fiat
                              - crypto
                              description: Whether the currency is fiat or crypto.
                              example: fiat
                            symbol:
                              type: string
                              description: ISO symbol of the currency.
                              example: EUR
                            enabled:
                              type: boolean
                              description: Whether the currency is currently enabled (not temporarily disabled).
                              example: true
                            disabled_message:
                              type:
                              - string
                              - 'null'
                              description: Reason the currency is temporarily disabled, or null when enabled.
                              example: null
                        credited_amount:
                          type: string
                          description: Amount credited in this transaction, as a positive decimal string. Credits reduce the account balance (e.g. a fee or withdrawal). "0" when the transaction is a debit.
                          example: '0.11'
                        debited_amount:
                          type: string
                          description: Amount debited in this transaction, as a positive decimal string. Debits increase the account balance (e.g. an incoming merchant_order). "0" when the transaction is a credit.
                          example: '0'
                        closing_balance:
                          type: string
                          description: Account balance immediately after this transaction was applied.
                          example: '10.88'
        '401':
          description: Missing or invalid API token.
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: Auth Token is not valid
                    reason: BadAuthToken
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Auth Token is not valid
                  reason:
                    type: string
                    example: BadAuthToken
        '422':
          description: A date filter is not a valid YYYY-MM-DD date.
          content:
            application/json:
              examples:
                Result:
                  value:
                    message: Please correct date format 2026-13-99
                    reason: IncorrectDateRangeError
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Please correct date format 2026-13-99
                  reason:
                    type: string
                    example: IncorrectDateRangeError
      deprecated: false
      tags:
      - Ledger
  /ledger/conversions:
    post:
      summary: Create Conversion
      description: ''
      operationId: create-conversion
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ledger_account_id:
                  type: string
                  description: The ID of the ledger account from which the balance will be converted. Can be retrieved from https://api.coingate.com/api/v2/ledger/accounts
                quote_currency_id:
                  type: integer
                  description: The ID of the currency to which the balance will be converted. Can be retrieved from https://developer.coingate.com/reference/conversion-rates
                base_amount:
                  type: string
                  description: Amount to convert, expressed in the currency of the ledger account
              required:
              - ledger_account_id
              - quote_currency_id
              - base_amount
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"01JWDJNDPFYC04ZCPC9VC568SP\",\n  \"status\": \"pending\",\n  \"base_amount\": \"0.001\",\n  \"base_ledger_account\": {\n    \"id\": \"01JRFQJ16HTQTT969F3G81F185\",\n    \"balance\": \"0.93534066\",\n    \"status\": \"active\",\n    \"currency\": {\n      \"id\": 1,\n      \"title\": \"Bitcoin\",\n      \"kind\": \"crypto\",\n      \"symbol\": \"BTC\",\n      \"enabled\": true,\n      \"disabled_message\": null\n    }\n  },\n  \"quote_amount\": \"81.67\",\n  \"quote_ledger_account\": {\n    \"id\": \"01JS1EHJDFEF9KD5J9FFV2A1S0\",\n    \"balance\": \"1387.13\",\n    \"status\": \"active\",\n    \"currency\": {\n      \"id\": 2,\n      \"title\": \"Euro\",\n      \"kind\": \"fiat\",\n      \"symbol\": \"EUR\",\n      \"enabled\": true,\n      \"disabled_message\": null\n    }\n  },\n  \"fees\": {\n    \"conversion_fee\": {\n      \"amount\": \"0.00001\",\n      \"currency\": {\n        \"id\": 1,\n        \"title\": \"Bitcoin\",\n        \"kind\": \"crypto\",\n        \"symbol\": \"BTC\",\n        \"enabled\": true,\n        \"disabled_message\": null\n      }\n    }\n  },\n  \"actions_required\": {\n    \"confirm\": \"https://api.coingate.com/api/v2/ledger/conversions/01JWDJNDPFYC04ZCPC9VC568SP/confirm\",\n    \"cancel\": \"https://api.coingate.com/api/v2/ledger/conversions/01JWDJNDPFYC04ZCPC9VC568SP/cancel\"\n  },\n  \"created_at\": \"2025-05-29T08:31:13.622Z\",\n  \"expires_at\": \"2025-05-29T08:32:18.615Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 01JWDJNDPFYC04ZCPC9VC568SP
                  status:
                    type: string
                    example: pending
                  base_amount:
                    type: string
                    example: '0.001'
                  base_ledger_account:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01JRFQJ16HTQTT969F3G81F185
                      balance:
                        type: string
                        example: '0.93534066'
                      status:
                        type: string
                        example: active
                      currency:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                            default: 0
                          title:
                            type: string
                            example: Bitcoin
                          kind:
                            type: string
                            example: crypto
                          symbol:
                            type: string
                            example: BTC
                          enabled:
                            type: boolean
                            example: true
                            default: true
                          disabled_message: {}
                  quote_amount:
                    type: string
                    example: '81.67'
                  quote_ledger_account:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01JS1EHJDFEF9KD5J9FFV2A1S0
                      balance:
                        type: string
                        example: '1387.13'
                      status:
                        type: string
                        example: active
                      currency:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                            default: 0
                          title:
                            type: string
                            example: Euro
                          kind:
                            type: string
                            example: fiat
                          symbol:
                            type: string
                            example: EUR
                          enabled:
                            type: boolean
                            example: true
                            default: true
                          disabled_message: {}
                  fees:
                    type: object
                    properties:
                      conversion_fee:
                        type: object
                        properties:
                          amount:
                            type: string
                            example: '0.00001'
                          currency:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                                default: 0
                              title:
                                type: string
                                example: Bitcoin
                              kind:
                                type: string
                                example: crypto
                              symbol:
                                type: string
                                example: BTC
                              enabled:
                                type: boolean
                                example: true
                                default: true
                              disabled_message: {}
                  actions_required:
                    type: object
                    properties:
                      confirm:
                        type: string
                        example: https://api.coingate.com/api/v2/ledger/conversions/01JWDJNDPFYC04ZCPC9VC568SP/confirm
                      cancel:
                        type: string
                        example: https://api.coingate.com/api/v2/ledger/conversions/01JWDJNDPFYC04ZCPC9VC568SP/cancel
                  created_at:
                    type: string
                    example: '2025-05-29T08:31:13.622Z'
                  expires_at:
                    type: string
                    example: '2025-05-29T08:32:18.615Z'
        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"Ledger Conversion is not valid\",\n  \"reason\": \"LedgerConversionIsNotValid\",\n  \"errors\": [\n    \"The BTC/GBP conversion pair is not supported on CoinGate.\"\n  ]\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Ledger Conversion is not valid
                  reason:
                    type: string
                    example: LedgerConversionIsNotValid
                  errors:
                    type: array
                    items:
                      type: string
                      example: The BTC/GBP conversion pair is not supported on CoinGate.
      deprecated: false
      tags:
      - Ledger
    get:
      summary: List Conversions
      description: ''
      operationId: list-conversions
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                per_page:
                  type: integer
                  description: Records per page you would like to see
                  default: 100
                  format: int32
                page:
                  type: integer
                  description: Current page number
                  default: 1
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
