name: CoinGate
description: CoinGate is a cryptocurrency payment gateway providing REST APIs for
  creating and managing payment orders, processing crypto-to-fiat conversions, automating
  payouts, managing merchant ledger accounts, and accessing billing and reporting
  data. Merchants can accept 70+ cryptocurrencies and settle in fiat or crypto, with
  integrations available via hosted checkout, plugins, and direct API.
